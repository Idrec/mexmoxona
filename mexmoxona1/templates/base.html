<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mehmonxona{% endblock %}</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  {% with current=request.resolver_match.url_name %}
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-4xl flex-wrap items-center justify-between gap-3 px-4 py-4">
      <a href="{% url 'booking:home' %}" class="text-lg font-semibold tracking-tight text-slate-900">Mehmonxona</a>
      <nav class="flex gap-1 text-sm font-medium">
        <a href="{% url 'booking:home' %}"
           class="rounded-lg px-3 py-2 {% if current == 'home' %}bg-sky-50 text-sky-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Qidirish</a>
        <a href="{% url 'booking:rooms' %}"
           class="rounded-lg px-3 py-2 {% if current == 'rooms' %}bg-sky-50 text-sky-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Xonalar</a>
        {% if user.is_staff %}
          <a href="{% url 'booking:booking_list' %}"
             class="rounded-lg px-3 py-2 {% if current == 'booking_list' %}bg-sky-50 text-sky-700{% else %}text-slate-600 hover:bg-slate-100{% endif %}">Bronlar</a>
        {% endif %}
      </nav>
    </div>
  </header>
  {% endwith %}

  <main class="mx-auto max-w-4xl px-4 py-8">
    {% if messages %}
      <ul class="mb-6 space-y-2">
        {% for message in messages %}
          <li class="rounded-xl border p-4 text-sm {% if message.level_tag == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">
            {{ message }}
          </li>
        {% endfor %}
      </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
